name: Deploy

# Ships main to the AWS instance it shares with Serviqo once CI has passed on
# it (Serviqo's ADR-061): build here, upload the release to the private S3
# bucket, then run the bunty-deploy SSM document, which unpacks it, switches
# over, checks /health and puts the previous release back on failure.
#
# AWS access is by OpenID Connect: the role trusts this repository's main
# branch only, may upload only Bunty releases and may run only that one
# document. No AWS key or other secret is stored in this repository. The job is
# skipped until these repository variables exist (none of them is a secret):
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, BUNTY_RELEASE_BUCKET, BUNTY_INSTANCE_ID,
#   BUNTY_DEPLOY_DOCUMENT and, optionally, BUNTY_PUBLIC_URL.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to AWS
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      BUCKET: ${{ vars.BUNTY_RELEASE_BUCKET }}
      INSTANCE_ID: ${{ vars.BUNTY_INSTANCE_ID }}
      DOCUMENT: ${{ vars.BUNTY_DEPLOY_DOCUMENT }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package the release
        run: |
          tar -czf "$RUNNER_TEMP/release.tar.gz" \
            package.json package-lock.json \
            server/package.json server/dist \
            web/package.json web/dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload the release
        run: |
          release_id="${SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          aws s3 cp "$RUNNER_TEMP/release.tar.gz" "s3://$BUCKET/bunty-releases/$release_id.tar.gz" --only-show-errors

      - name: Switch the instance to this release
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$DOCUMENT" \
            --comment "Deploy Bunty $RELEASE_ID" \
            --parameters "releaseId=$RELEASE_ID" \
            --query Command.CommandId --output text)
          echo "SSM command $command_id"

          status=Pending
          for _ in $(seq 1 240); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          echo "---- instance output ----"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "---- instance errors ----"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true

          echo "Status: $status"
          test "$status" = Success

      - name: Check the public site
        if: vars.BUNTY_PUBLIC_URL != ''
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 10 "${{ vars.BUNTY_PUBLIC_URL }}/health" | grep -q '"ok":true'; then
              echo "Public site is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "The instance is healthy but ${{ vars.BUNTY_PUBLIC_URL }}/health is not answering; check the Cloudflare Tunnel route."
          exit 1
